# Despliegue rapido del microservicio Idiolect-G2P en entornos de investigacion.
# Uso: docker compose up --build -d

name: idiolect-g2p

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: idiolect-g2p:latest
    container_name: idiolect-g2p
    ports:
      - "${IDIOLECT_PORT:-8000}:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      HOME: /tmp
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
