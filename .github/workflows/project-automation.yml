name: Automatizacion de Tablero de Proyectos

# Control de eventos para trazabilidad de incidencias y solicitudes de extraccion
on:
  issues:
    types:
      - opened
      - closed
      - reopened
  pull_request:
    types:
      - opened
      - closed
      - reopened

# Principio de menor privilegio a nivel de flujo de trabajo
permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  asignar-y-mover-tarjeta:
    name: Sincronizar Elemento con Proyecto
    runs-on: ubuntu-latest
    steps:
      - name: Asignar nuevo elemento al tablero de proyecto
        if: github.event.action == 'opened'
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/${{ github.repository_owner }}/projects/1
          github-token: ${{ secrets.PROJECT_PAT }}

      - name: Mover tarjeta a Completado al cerrar o fusionar
        if: github.event.action == 'closed'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          ITEM_NODE_ID: ${{ github.event.issue.node_id || github.event.pull_request.node_id }}
        run: |
          # 1. Asignar o asegurar que el elemento este en el proyecto y obtener su ProjectV2Item ID
          ITEM_ID=$(gh api graphql -f query='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                item {
                  id
                }
              }
            }' -f projectId="PVT_kwHOD0rXac4BiN6I" -f contentId="$ITEM_NODE_ID" --jq '.data.addProjectV2ItemById.item.id')

          # 2. Actualizar el estado a Done (opcion: 98236657) en el campo Status (campo: PVTSSF_lAHOD0rXac4BiN6IzhhGwJ8)
          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId,
                itemId: $itemId,
                fieldId: $fieldId,
                value: { singleSelectOptionId: $optId }
              }) {
                projectV2Item {
                  id
                }
              }
            }' -f projectId="PVT_kwHOD0rXac4BiN6I" -f itemId="$ITEM_ID" -f fieldId="PVTSSF_lAHOD0rXac4BiN6IzhhGwJ8" -f optId="98236657"
