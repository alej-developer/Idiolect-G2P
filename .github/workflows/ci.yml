name: Integración Continua y Cobertura de Código

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Suite de Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias de producción y desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar suite de pruebas con cobertura
        run: |
          python -m pytest -v --tb=short --cov=idiolect_g2p --cov-report=term-missing

      - name: Verificar integridad de importaciones del paquete
        run: |
          python -c "import idiolect_g2p; print(f'Idiolect-G2P v{idiolect_g2p.__version__} importado correctamente')"
